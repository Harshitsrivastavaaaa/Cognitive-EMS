<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: http://localhost:8000; connect-src 'self' http://localhost:8000 ws://localhost:5173 http://localhost:5173 ws://localhost:8000;">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Cognitive EMS — Employee Management System</title>
    <style>
      /* Shown instantly until React mounts and replaces #root's contents */
      body { margin: 0; background: #f8fafc; }
      .boot-loader { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; font-family: 'Outfit', ui-sans-serif, system-ui, sans-serif; color: #2563eb; }
      .boot-spinner { width: 36px; height: 36px; border-radius: 9999px; border: 3px solid #e2e8f0; border-top-color: #2563eb; animation: boot-spin 0.8s linear infinite; }
      .boot-text { font-size: 11px; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (min-width: 1024px) { html { zoom: 0.75; } .boot-loader { min-height: calc(100vh / 0.75); } }
      @media (prefers-reduced-motion: reduce) { .boot-spinner { animation-duration: 2.4s; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader" role="status" aria-live="polite">
        <div class="boot-spinner"></div>
        <div class="boot-text">Loading Cognitive EMS</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
